[project]
name = "ane-speech-convert"
version = "0.0.0"
description = "Convert mlx-speech checkpoints to Core AI models."
requires-python = ">=3.13"
dependencies = [
    "coreai-core==1.0.0b3",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["convert/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
