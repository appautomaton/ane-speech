name: Release

# Publishes to PyPI when a v* tag is pushed. PyPI trusts this file by name
# (trusted publishing), so no token is stored anywhere. The publish job waits
# in the `pypi` environment until a maintainer approves it on GitHub.
#
# A tag like v0.1.1rc1 publishes a pre-release, which pip and uv install only
# when asked for one.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ane-speech
    permissions:
      id-token: write # trusted publishing; PEP 740 attestations are on by default
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # The one step that can publish as us, so it is pinned to an exact commit.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
